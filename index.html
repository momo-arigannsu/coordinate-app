<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コーデアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>クローゼット</h1>

    <!-- 服の登録フォーム -->
    <section class="card">
      <h2>服を登録</h2>
      <form id="clothes-form">
        <label class="field">写真
          <input type="file" id="photo" accept="image/*" required>
        </label>
        <img id="preview" alt="プレビュー" hidden>

        <label class="field">種類
          <select id="category" required>
            <option value="">選んでね</option>
            <option>トップス</option>
            <option>ボトムス</option>
            <option>ワンピース</option>
            <option>アウター</option>
            <option>靴</option>
            <option>バッグ</option>
            <option>アクセサリー</option>
          </select>
        </label>

        <fieldset>
          <legend>雰囲気タグ（複数OK）</legend>
          <!-- チェックボックスはscript.jsで自動生成 -->
          <div id="mood-tags" class="tags"></div>
        </fieldset>

        <button type="submit">登録する</button>
      </form>
    </section>

    <!-- 登録した服の一覧 -->
    <section>
      <h2>手持ちの服 <span id="count"></span></h2>
      <div id="clothes-list" class="grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
